# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
on: pull_request
permissions:
  contents: read
